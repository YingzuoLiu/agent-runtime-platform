name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
      TF_FORMAT_MODE: check
      TF_LOCKFILE_MODE: readonly
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1
          terraform_wrapper: false
      - name: Credential-free Terraform format, validation, and mock plans
        run: bash deploy/aws/scripts/offline-check.sh

  p6b2-exact-image-proof:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact-image PostgreSQL TLS and lifecycle proof
        env:
          P6B2_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -u examples/p6b2_exact_image_proof.py
      - name: Recheck bounded proof artifact
        run: >-
          python -c "import json, pathlib;
          p=pathlib.Path('artifacts/p6b2-exact-image-proof.json');
          data=json.loads(p.read_text());
          assert data['proof']=='p6b2-exact-image-lifecycle:1';
          assert data['summary']=={'failed': 0, 'passed': 8};
          assert data['tls']['mode']=='verify-full';
          assert data['tls']['wrong_hostname_rejected'] is True;
          assert data['logs']['secret_canary_occurrences']==0"
      - run: git diff --exit-code
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p6b2-exact-image-proof-${{ github.run_attempt }}
          path: artifacts/p6b2-exact-image-proof.json
          if-no-files-found: error
          retention-days: 7
      - name: Bounded container diagnostics
        if: failure()
        run: >-
          docker ps -a
          --format '{{.ID}} {{.Image}} {{.Status}} {{.Names}}'

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall agent api demo_provider runtime_service domains examples scripts
      - run: ruff check agent api demo_provider runtime_service tests domains examples scripts
      - run: python scripts/check_substrate_contract.py
      - run: mypy
      - run: pytest -q
      - run: git diff --check
      - run: docker compose config --quiet

  postgres-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: conformance-only
          POSTGRES_DB: runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:conformance-only@127.0.0.1:5432/runtime_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: |
          python -c "import psycopg; print('psycopg driver import: ok')"
      - name: SQLite shared conformance
        env:
          STORE_CONFORMANCE_BACKENDS: sqlite
        run: >-
          pytest -q
          tests/conformance/test_run_store_contract.py
          tests/conformance/test_workflow_store_contract.py
          tests/conformance/test_execution_plane_contract.py
          tests/conformance/test_quarantine_evidence_contract.py
          tests/conformance/test_memory_store_contract.py
      - name: PostgreSQL shared conformance
        env:
          STORE_CONFORMANCE_BACKENDS: postgres
        run: >-
          pytest -q
          tests/conformance/test_run_store_contract.py
          tests/conformance/test_workflow_store_contract.py
          tests/conformance/test_execution_plane_contract.py
          tests/conformance/test_quarantine_evidence_contract.py
          tests/conformance/test_memory_store_contract.py
      - name: PostgreSQL backend and Memory mechanics
        env:
          STORE_CONFORMANCE_BACKENDS: postgres
        run: >-
          pytest -q
          tests/conformance/test_postgres_backend.py
          tests/conformance/test_postgres_memory_backend.py
          tests/conformance/test_postgres_application_composition.py

  postgres-mutation-proof:
    needs: postgres-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: conformance-only
          POSTGRES_DB: runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:conformance-only@127.0.0.1:5432/runtime_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python tests/conformance/postgres_mutation_proof.py
      - run: python tests/conformance/postgres_memory_mutation_proof.py
      - name: Prove mutation runner restored source
        if: always()
        run: git diff --exit-code

  action-recovery-proof:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: arp-proof-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python examples/action_recovery_proof.py
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: action-recovery-proof-${{ github.run_attempt }}
          path: artifacts/action-recovery-proof.json
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail=200 || true
      - if: always()
        run: docker compose down --volumes --remove-orphans

  p5-multi-worker-proof:
    needs: [test, postgres-conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p5-secret-canary
          POSTGRES_DB: runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      P5_POSTGRES_DSN: postgresql://postgres:p5-secret-canary@127.0.0.1:5432/runtime_test
      P5_SECRET_CANARY: p5-secret-canary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Two-process PostgreSQL recovery proof (required; never skipped)
        run: >-
          timeout --signal=TERM --kill-after=15s 300s
          python -u examples/p5_multi_worker_proof.py
      - name: Recheck sanitized proof artifact
        run: >-
          python -c "import json, os, pathlib;
          p=pathlib.Path('artifacts/p5-multi-worker-proof.json');
          raw=p.read_text();
          assert os.environ['P5_SECRET_CANARY'] not in raw;
          data=json.loads(raw);
          assert data['proof']=='p5-multi-worker-recovery:1';
          assert data['summary']=={'failed': 0, 'passed': 8}"
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p5-multi-worker-proof-${{ github.run_attempt }}
          path: artifacts/p5-multi-worker-proof.json
          if-no-files-found: error
          retention-days: 7
      - name: Bounded PostgreSQL diagnostics
        if: failure()
        env:
          PGPASSWORD: p5-secret-canary
        run: >-
          psql -h 127.0.0.1 -U postgres -d runtime_test -X
          -c "SELECT pid, application_name, state, wait_event_type, wait_event
          FROM pg_stat_activity
          WHERE application_name = 'p5_multi_worker_proof'
          ORDER BY pid LIMIT 20"
      - name: Clean proof-owned schemas after interrupted runs
        if: always()
        env:
          PGPASSWORD: p5-secret-canary
        run: |
          psql -h 127.0.0.1 -U postgres -d runtime_test -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $cleanup$
          DECLARE target text;
          BEGIN
            FOR target IN
              SELECT schema_name FROM information_schema.schemata
              WHERE schema_name LIKE 'p5\_%' ESCAPE '\'
            LOOP
              EXECUTE format('DROP SCHEMA %I CASCADE', target);
            END LOOP;
          END
          $cleanup$;
          SQL

  p5-mutation-proof:
    needs: p5-multi-worker-proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p5-mutation-canary
          POSTGRES_DB: runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      P5_POSTGRES_DSN: postgresql://postgres:p5-mutation-canary@127.0.0.1:5432/runtime_test
      P5_SECRET_CANARY: p5-mutation-canary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: P5 source mutation controls (required; never skipped)
        run: python tests/conformance/p5_mutation_proof.py
      - name: Prove P5 mutation runner restored every source file
        if: always()
        run: |
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            echo "P5 mutation runner left the working tree dirty:"
            git status --porcelain
            exit 1
          fi
      - name: Clean mutation-owned schemas after interrupted runs
        if: always()
        env:
          PGPASSWORD: p5-mutation-canary
        run: |
          psql -h 127.0.0.1 -U postgres -d runtime_test -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $cleanup$
          DECLARE target text;
          BEGIN
            FOR target IN
              SELECT schema_name FROM information_schema.schemata
              WHERE schema_name LIKE 'p5\_%' ESCAPE '\'
            LOOP
              EXECUTE format('DROP SCHEMA %I CASCADE', target);
            END LOOP;
          END
          $cleanup$;
          SQL
