[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["runtime_service/auth.py", "runtime_service/action_gateway.py", "runtime_service/action_gateway_service.py", "runtime_service/canonical.py", "runtime_service/dag.py", "runtime_service/deployment.py", "runtime_service/evidence.py", "runtime_service/extensions.py", "runtime_service/external_action_coordinator.py", "runtime_service/external_actions.py", "runtime_service/http_external_action.py", "runtime_service/memory.py", "runtime_service/models.py", "runtime_service/quarantine.py", "runtime_service/quarantine_resolution.py", "runtime_service/registry.py", "runtime_service/manager.py", "runtime_service/run_store.py", "runtime_service/serve.py", "runtime_service/store.py", "runtime_service/storage.py", "runtime_service/structured_logging.py", "runtime_service/postgres_bootstrap.py", "runtime_service/postgres_schema.py", "runtime_service/postgres_store.py", "runtime_service/postgres_memory_store.py", "runtime_service/postgres_workflow_store.py", "runtime_service/workflow_store.py", "runtime_service/sandbox.py", "runtime_service/sandbox_worker.py", "runtime_service/planner.py", "runtime_service/dynamic_loop.py", "runtime_service/openai_planner.py", "api/demo.py", "api/main.py", "agent/contracts.py", "demo_provider", "domains/durable_action", "domains/travel/state.py", "domains/travel/runtime.py", "domains/travel/dynamic_runtime.py", "domains/travel/external_action_runtime.py", "domains/travel/memory.py", "domains/travel/preferences.py", "domains/travel/planner.py", "domains/travel/tools/models.py", "domains/travel/tools/registry.py", "domains/travel/tools/trip_hold_provider.py", "domains/release_validation/models.py", "domains/release_validation/runtime.py", "domains/release_validation/tools.py", "domains/incident_triage", "examples/action_recovery_proof.py", "examples/p6b2_exact_image_proof.py", "examples/p6b2_tls_negative_control.py", "examples/runtime_lease_probe.py", "examples/p5_multi_worker_proof.py", "examples/p5_postgres_probe.py", "examples/p5_proof_worker.py", "examples/external_agent.py", "examples/incident_triage_app.py", "scripts/check_substrate_contract.py"]
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
