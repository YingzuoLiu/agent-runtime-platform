[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["runtime_service/auth.py", "runtime_service/dag.py", "runtime_service/models.py", "runtime_service/registry.py", "runtime_service/manager.py", "runtime_service/store.py", "runtime_service/workflow_store.py", "api/main.py", "agent/contracts.py", "domains/travel/state.py", "domains/travel/runtime.py", "domains/release_validation/models.py", "domains/release_validation/runtime.py"]
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
